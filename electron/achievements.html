<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Lumia 今日成就墙</title>
  <link rel="stylesheet" href="chrome.css" />
  <style>
    .ach-body { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 24px; }
    h1 { font-size: 20px; color: #f5b7ad; margin: 0 0 4px; }
    .sub { opacity: 0.6; font-size: 13px; margin-bottom: 18px; }
    h2 { font-size: 15px; margin: 22px 0 8px; color: #cfc9dc; }
    .repo-err { font-size: 12px; color: #b0736a; margin: 4px 0; }
    .commit { background: #26242e; border: 2px solid #34313e; border-radius: 0; margin: 6px 0; cursor: pointer; }
    .commit-row { padding: 8px 12px; display: flex; gap: 10px; align-items: baseline; }
    .repo-tag { font-size: 11px; color: #9a95a8; background: #2f2c3a; border-radius: 0;
      padding: 1px 6px; white-space: nowrap; }
    .hash { font-family: Consolas, monospace; color: #e0887a; font-size: 12px; }
    .subject { flex: 1; }
    .time { font-size: 11px; opacity: 0.5; }
    .commit-detail { display: none; padding: 0 12px 10px; }
    .commit.open .commit-detail { display: block; }
    .commit-authors { display: flex; flex-direction: column; gap: 6px;
      border-top: 1px solid #34313e; padding-top: 8px; margin-bottom: 8px; }
    .commit-author { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .avatar { width: 24px; height: 24px; border-radius: 0; flex: none; image-rendering: pixelated; }
    .avatar-fallback { width: 24px; height: 24px; border-radius: 0; flex: none; background: #3a3646;
      color: #cfc9dc; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; }
    .author-link { cursor: pointer; }
    .author-link:hover .author-name { text-decoration: underline; color: #8ab4f8; }
    .commit-body { font-size: 12px; opacity: 0.75; white-space: pre-wrap; word-break: break-all; }
    .commit-link { display: inline-block; margin-top: 8px; font-size: 12px; color: #8ab4f8;
      text-decoration: underline; cursor: pointer; }
    .idea { padding: 8px 12px; background: #241f26; border: 2px solid #34313e; border-radius: 0; margin: 6px 0; font-size: 13px; }
    .empty { opacity: 0.5; font-style: italic; font-size: 13px; }
  </style>
</head>
<body>
  <div class="lumia-window">
    <div class="lumia-titlebar">
      <button class="tb-btn tb-fs" id="tbFs">全屏</button>
      <div class="tb-title" id="tbTitle">Lumia · 今日成就墙</div>
      <button class="tb-btn tb-close" id="tbClose">✕</button>
    </div>

    <div class="lumia-body">
      <div class="ach-body">
        <h1>今日成就墙</h1>
        <div class="sub" id="sub">加载中…</div>

        <h2>Commits</h2>
        <div id="commits"><div class="empty">加载中…</div></div>

        <h2>今日灵感</h2>
        <div id="ideas"><div class="empty">加载中…</div></div>
      </div>
    </div>
  </div>

  <div class="lumia-handle"></div>
  <script src="chrome.js"></script>
  <script>
    function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

    function renderCommit(box, c) {
      const item = document.createElement('div');
      item.className = 'commit';
      const contribs = (c.contributors && c.contributors.length)
        ? c.contributors
        : [{ name: c.author, url: c.author_url, avatar: c.avatar_url }];
      const authorRows = contribs.map((p) => {
        const av = p.avatar
          ? `<img class="avatar" src="${esc(p.avatar)}" onerror="this.style.display='none'">`
          : `<span class="avatar-fallback">${esc((p.name || '?').slice(0, 1).toUpperCase())}</span>`;
        const inner = av + `<span class="author-name">${esc(p.name || '')}</span>`;
        return p.url
          ? `<div class="commit-author author-link" data-url="${esc(p.url)}">${inner} ↗</div>`
          : `<div class="commit-author">${inner}</div>`;
      }).join('');
      const detail = `<div class="commit-authors">${authorRows}</div>` +
        (c.body ? `<div class="commit-body">${esc(c.body)}</div>` : '<div class="commit-body">没有更多描述。</div>') +
        (c.url ? `<span class="commit-link" data-url="${esc(c.url)}">在浏览器中打开此 commit ↗</span>` : '');
      item.innerHTML = `<div class="commit-row">` +
        `<span class="repo-tag">${esc(c.repo)}</span>` +
        `<span class="hash">${esc(c.hash)}</span>` +
        `<span class="subject">${esc(c.subject)}</span>` +
        `<span class="time">${esc((c.time || '').slice(11, 16))}</span>` +
        `</div><div class="commit-detail">${detail}</div>`;
      item.addEventListener('click', (ev) => {
        const link = ev.target.closest('[data-url]');
        if (link) { window.lumia.openExternal(link.dataset.url); return; }
        item.classList.toggle('open');
      });
      box.appendChild(item);
    }

    async function loadCommits() {
      const box = document.getElementById('commits');
      const PAGE = 15;
      let offset = 0;
      try {
        while (true) {
          const ach = await window.lumia.fetchJSON(`/api/achievements/today?offset=${offset}&limit=${PAGE}`);
          if (offset === 0) {
            document.getElementById('sub').textContent =
              `${ach.date} · 共 ${ach.total_commits} 次提交`;
            box.innerHTML = '';
            for (const r of ach.repos || []) {
              if (r.error) {
                const err = document.createElement('div');
                err.className = 'repo-err';
                err.textContent = `${r.name}: ${r.error}`;
                box.appendChild(err);
              }
            }
            if (ach.github && ach.github.error) {
              const err = document.createElement('div');
              err.className = 'repo-err';
              err.textContent = `GitHub(${ach.github.username}): ${ach.github.error}`;
              box.appendChild(err);
            }
            const hasSource = (ach.repos && ach.repos.length > 0) || (ach.github && ach.github.username);
            if (!hasSource) {
              box.innerHTML = '<div class="empty">未配置 git 仓库或 GitHub 账号（设置 → 成就墙）。</div>';
              return;
            }
            if (ach.total_commits === 0) {
              const e = document.createElement('div');
              e.className = 'empty';
              e.textContent = '今天还没有提交。';
              box.appendChild(e);
              return;
            }
          }
          for (const c of ach.commits || []) renderCommit(box, c);
          offset += (ach.commits || []).length;
          if (offset >= ach.total_commits || (ach.commits || []).length === 0) return;
        }
      } catch (e) {
        if (offset === 0) document.getElementById('sub').textContent = '无法连接后端 (:8787)。';
      }
    }

    async function loadIdeas() {
      try {
        const data = await window.lumia.fetchJSON('/api/ideas?limit=50');
        const today = new Date().toISOString().slice(0, 10);
        const box = document.getElementById('ideas');
        box.innerHTML = '';
        const todays = (data.ideas || []).filter((i) => (i.ts || '').slice(0, 10) === today);
        if (todays.length === 0) {
          box.innerHTML = '<div class="empty">今天还没有捕捉到灵感。</div>';
        }
        for (const idea of todays) {
          const row = document.createElement('div');
          row.className = 'idea';
          const label = idea.kind === 'audio' ? '🎙 语音灵感' : esc(idea.text);
          row.innerHTML = `${label} <span class="time">· ${esc((idea.ts || '').slice(11, 16))}</span>`;
          box.appendChild(row);
        }
      } catch (e) {}
    }

    loadIdeas();
    loadCommits();
  </script>
</body>
</html>
