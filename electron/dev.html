<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Lumia 开发者面板</title>
  <link rel="stylesheet" href="chrome.css" />
  <style>
    .dev-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px; }
    .dev-group { margin-bottom: 16px; }
    .dev-group h3 { font-size: 12px; color: #7f7a8c; margin: 0 0 8px; font-weight: 600;
      letter-spacing: 0.4px; }
    .dev-grid { display: flex; flex-direction: column; gap: 6px; }
    .dev-grid .btn { text-align: left; }
    .dev-row { display: flex; gap: 6px; }
    .dev-row input { flex: 1; min-width: 0; background: #232230; border: 2px solid #3a3747;
      color: #f2f0f7; border-radius: 0; padding: 5px 10px; font-size: 12.5px; outline: none; }
    .dev-row .btn { flex-shrink: 0; }
    .dev-tip { font-size: 11.5px; color: #6f6b7c; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="lumia-window">
    <div class="lumia-titlebar">
      <button class="tb-btn tb-fs" id="tbFs">全屏</button>
      <div class="tb-title" id="tbTitle">Lumia • 开发者面板</div>
      <button class="tb-btn tb-close" id="tbClose">✕</button>
    </div>

    <div class="lumia-body">
      <div class="dev-body">
        <div class="dev-group">
          <h3>提醒弹窗</h3>
          <div class="dev-grid" id="reminders"></div>
        </div>
        <div class="dev-group">
          <h3>开发时长弹窗</h3>
          <div class="dev-grid" id="coding"></div>
        </div>
        <div class="dev-group">
          <h3>窗口 / 状态</h3>
          <div class="dev-grid" id="windows"></div>
        </div>
        <div class="dev-group">
          <h3>数据</h3>
          <div class="dev-grid" id="data">
            <div class="dev-row">
              <input type="number" id="usedMin" min="0" step="1" placeholder="分钟" />
              <button class="btn" id="setUsedBtn">设置已开发时长</button>
            </div>
          </div>
          <div class="dev-tip" id="dataResult"></div>
        </div>
        <div class="dev-tip">点一下即刻弹出，方便测试喵~</div>
      </div>
    </div>
  </div>

  <div class="lumia-handle"></div>
  <script src="chrome.js"></script>
  <script>
    const delayMin = 60;
    const reminderPresets = [
      { label: '该睡觉了', event: { type: 'reminder_sleep', title: '该睡觉了', message: '别熬了，关机前把今天投到墙上看看吧。' } },
      { label: '该吃饭了', event: { type: 'reminder_meal', title: '该吃饭了', message: '离开键盘，去好好吃一顿。' } },
      { label: '喝口水', event: { type: 'reminder_water', title: '喝口水', message: '补点水分，顺便让眼睛歇一会儿。' } },
      { label: '起来动一动', event: { type: 'reminder_move', title: '起来动一动', message: '站起来伸展一下，走两步。' } },
      { label: '久坐提醒', event: { type: 'reminder_sedentary', title: '久坐提醒', message: '你已经连续坐了约 60 分钟，起来拉伸一下。' } },
    ];
    const codingPresets = [
      { label: '时长已用尽（带延时）', event: { type: 'coding_limit', title: '今日开发时长已用尽',
        message: '该收尾了。需要的话可以使用一次延时（今天最后一段）。',
        actions: [{ id: 'delay', label: '延时 ' + delayMin + ' 分钟' }, { id: 'achievements', label: '看看今天的成绩' }] } },
      { label: '延时已开启', event: { type: 'coding_delay_started', title: '延时已开启', message: '给你多争取一段时间，收好这最后一程。' } },
      { label: '今天到此为止', event: { type: 'coding_locked', title: '今天到此为止',
        message: '开发时长（含延时）已结束。去看看今天做成了什么吧。',
        actions: [{ id: 'achievements', label: '查看成就墙' }] } },
    ];

    function makeBtn(parent, label, onClick) {
      const b = document.createElement('button');
      b.className = 'btn';
      b.textContent = label;
      b.addEventListener('click', onClick);
      parent.appendChild(b);
    }

    const remEl = document.getElementById('reminders');
    reminderPresets.forEach((p) => makeBtn(remEl, p.label, () => window.lumia.dev.emit(p.event)));
    const codeEl = document.getElementById('coding');
    codingPresets.forEach((p) => makeBtn(codeEl, p.label, () => window.lumia.dev.emit(p.event)));

    const winEl = document.getElementById('windows');
    makeBtn(winEl, '打开设置', () => window.lumia.dev.open('settings'));
    makeBtn(winEl, '打开成就墙', () => window.lumia.dev.open('achievements'));
    makeBtn(winEl, '今日状态弹窗', async () => {
      try {
        const s = await window.lumia.fetchJSON('/api/state');
        const c = s.coding;
        const mins = (sec) => Math.round((sec || 0) / 60);
        window.lumia.dev.emit({
          type: 'status', title: 'Lumia 今日状态',
          message: `已开发 ${mins(c.used_seconds)} / ${mins(c.allowed_effective_seconds)} 分钟 • 状态 ${c.state}`,
          actions: [{ id: 'achievements', label: '成就墙' }],
        });
      } catch (_) {
        window.lumia.dev.emit({ type: 'status', title: 'Lumia', message: '后端未连接（:8787）。', actions: [] });
      }
    });

    const dataEl = document.getElementById('data');
    const dataResult = document.getElementById('dataResult');
    const usedMin = document.getElementById('usedMin');
    const setUsedBtn = document.getElementById('setUsedBtn');
    setUsedBtn.addEventListener('click', async () => {
      const v = parseFloat(usedMin.value);
      if (!isFinite(v) || v < 0) { dataResult.textContent = '请输入有效的分钟数'; return; }
      setUsedBtn.disabled = true;
      dataResult.textContent = '设置中…';
      try {
        const r = await window.lumia.postJSON('/api/dev/set-used', { minutes: v });
        dataResult.textContent = (r && r.ok) ? ('已设置为 ' + v + ' 分钟 ✓') : ('返回：' + JSON.stringify(r));
      } catch (_) {
        dataResult.textContent = '失败：后端未连接';
      }
      setUsedBtn.disabled = false;
    });
    function makeDangerBtn(parent, label, tip, run) {
      let armed = false;
      let timer = null;
      makeBtn(parent, label, async (e) => {
        const btn = e.currentTarget;
        if (!armed) {
          armed = true;
          btn.textContent = '再点一次确认';
          dataResult.textContent = tip;
          timer = setTimeout(() => {
            armed = false;
            btn.textContent = label;
            dataResult.textContent = '';
          }, 3000);
          return;
        }
        clearTimeout(timer);
        armed = false;
        btn.textContent = label;
        btn.disabled = true;
        dataResult.textContent = '执行中…';
        try {
          dataResult.textContent = await run();
        } catch (_) {
          dataResult.textContent = '失败：后端未连接';
        }
        btn.disabled = false;
      });
    }
    makeDangerBtn(dataEl, '重置今日数据', '将清零今日开发时长、延时与锁定', async () => {
      const r = await window.lumia.postJSON('/api/dev/reset', {});
      return (r && r.ok) ? ('已重置 ' + r.date + ' ✓') : ('返回：' + JSON.stringify(r));
    });
    makeDangerBtn(dataEl, '清空历史数据', '将删除所有天的开发时长与延时记录（想法不受影响）', async () => {
      const r = await window.lumia.postJSON('/api/dev/reset-history', {});
      return (r && r.ok) ? '历史已清空 ✓' : ('返回：' + JSON.stringify(r));
    });
  </script>
</body>
</html>
