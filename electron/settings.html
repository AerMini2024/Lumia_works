<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Lumia 设置</title>
  <link rel="stylesheet" href="chrome.css" />
  <style>
    .settings-content { flex: 1; min-height: 0; display: flex; }

    .settings-nav {
      flex: 0 0 148px; padding: 12px 8px; border-right: 1px solid rgba(255,255,255,0.06);
      display: flex; flex-direction: column; gap: 2px; overflow-y: auto;
    }
    .nav-item {
      padding: 9px 12px; border-radius: 8px; font-size: 13px; color: #b9b4c6; cursor: pointer;
    }
    .nav-item:hover { background: #26242e; }
    .nav-item.active { background: #2f2434; color: #f5b7ad; font-weight: 600; }

    .settings-main { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 22px; }
    .panel { display: none; }
    .panel.active { display: block; }
    .panel h2 { font-size: 15px; color: #cfc9dc; margin: 0 0 14px; }

    .field { display: flex; align-items: center; gap: 12px; margin: 12px 0; }
    .field label { flex: 0 0 132px; font-size: 13px; color: #b9b4c6; }
    .field .unit { font-size: 12px; color: #7f7a8c; }
    .field input[type="number"] { width: 96px; }
    .field input[type="time"] { width: 110px; }
    .field.col { align-items: flex-start; flex-direction: column; gap: 8px; }
    .field.col label { flex: none; }
    .hintline { font-size: 12px; color: #7f7a8c; margin: 6px 0 0 144px; }
    .preview { margin-top: 8px; padding: 10px 12px; background: #241f26; border-radius: 8px;
      font-size: 13px; color: #f5b7ad; }

    .tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; background: #2b2933;
      border-radius: 999px; padding: 4px 6px 4px 11px; font-size: 12px; }
    .tag .x { cursor: pointer; color: #8a8697; width: 16px; height: 16px; line-height: 16px;
      text-align: center; border-radius: 50%; }
    .tag .x:hover { background: #e81123; color: #fff; }
    .tag-add { display: flex; gap: 6px; margin-top: 8px; }
    .tag-add input { flex: 1; }

    .settings-footer {
      flex: 0 0 56px; display: flex; align-items: center; gap: 12px;
      padding: 0 18px; border-top: 1px solid rgba(255,255,255,0.07); background: rgba(16,15,20,0.35);
    }
    .footer-status { flex: 1; font-size: 12.5px; color: #7f7a8c; }
    .footer-status.dirty { color: #f5b7ad; }
    .footer-status.ok { color: #7bd88f; }

    .lumia-overlay { position: fixed; inset: 0; background: rgba(10,9,13,0.6);
      display: none; align-items: center; justify-content: center; z-index: 50; }
    .lumia-overlay.show { display: flex; }
    .overlay-card { width: 320px; background: #201e28; border: 1px solid rgba(224,136,122,0.3);
      border-radius: 14px; padding: 20px; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
    .overlay-title { font-size: 15px; color: #f5b7ad; font-weight: 600; }
    .overlay-count { font-size: 13px; color: #b9b4c6; margin: 10px 0 14px; }
    .overlay-count b { font-size: 22px; color: #fff; }
    .overlay-bar { height: 6px; background: #14131a; border-radius: 3px; overflow: hidden; margin-top: 16px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04); }
    .overlay-bar > div { height: 100%; width: 100%; border-radius: 3px;
      background: linear-gradient(90deg, #e0887a, #f5b7ad);
      box-shadow: 0 0 8px rgba(224,136,122,0.55); transition: width 15s linear; }
  </style>
</head>
<body>
  <div class="lumia-window">
    <div class="lumia-titlebar">
      <button class="tb-btn tb-fs" id="tbFs">全屏</button>
      <div class="tb-title" id="tbTitle">Lumia · 设置</div>
      <button class="tb-btn tb-close" id="tbClose">✕</button>
    </div>

    <div class="lumia-body">
      <div class="settings-content">
        <nav class="settings-nav" id="nav">
          <div class="nav-item active" data-panel="basic">基础设置</div>
          <div class="nav-item" data-panel="reminders">提醒</div>
          <div class="nav-item" data-panel="git">成就墙</div>
          <div class="nav-item" data-panel="server">服务</div>
        </nav>

        <main class="settings-main">
          <section class="panel active" data-panel="basic">
            <h2>基础设置</h2>
            <div class="field col"><label>计入开发的进程</label><div class="tags" data-list="coding.dev_processes"></div>
              <div class="tag-add"><input type="text" placeholder="如 Code.exe，回车添加"><button class="btn" data-add>添加</button></div></div>
            <div class="field"><label>久坐阈值</label><input type="number" step="5" min="1" data-path="sit.sedentary_minutes"><span class="unit">分钟</span></div>
            <div class="field"><label>重复提醒间隔</label><input type="number" step="5" min="1" data-path="sit.renudge_minutes"><span class="unit">分钟</span></div>
            <div class="field"><label>椅子模式</label>
              <select data-path="chair.mode"><option value="simulate">模拟（仅日志）</option><option value="relay">继电器</option></select></div>
            <div class="field"><label>继电器地址</label><input type="text" style="width:280px" data-path="chair.relay_url" id="relayUrl"></div>
            <div class="field"><label></label><button class="btn" id="chairTest">测试拉伸</button><span class="unit" id="chairTestResult"></span></div>
          </section>

          <section class="panel" data-panel="reminders">
            <h2>提醒</h2>
            <div class="field"><label>睡觉时间</label><input type="time" data-path="reminders.sleep_time"></div>
            <div class="field col"><label>吃饭时间</label><div class="tags" data-list="reminders.meals"></div>
              <div class="tag-add"><input type="time"><button class="btn" data-add>添加</button></div></div>
            <div class="field"><label>喝水间隔</label><input type="number" step="5" min="0" data-path="reminders.water_interval_min"><span class="unit">分钟</span></div>
            <div class="field"><label>活动间隔</label><input type="number" step="5" min="0" data-path="reminders.move_interval_min"><span class="unit">分钟</span></div>
          </section>

          <section class="panel" data-panel="git">
            <h2>成就墙 · git 仓库</h2>
            <div class="field col"><label>扫描的本地仓库</label><div class="tags" data-list="git.repos" data-vertical></div>
              <div class="tag-add"><input type="text" placeholder="仓库绝对路径"><button class="btn" data-add>添加</button><button class="btn" id="browseRepo">浏览…</button></div></div>
            <div class="hintline" style="margin-left:0">时长耗尽后，成就墙会列出这些仓库当天的 commits。</div>
            <div class="field"><label>Client ID</label><input type="text" style="width:180px" placeholder="GitHub OAuth App 的 Client ID" data-path="git.github_client_id"></div>
            <div class="field"><label></label><button class="btn" id="ghAuth">网页授权 GitHub</button><span class="unit" id="ghAuthResult"></span></div>
            <div class="field"><label>GitHub 用户名</label><input type="text" style="width:180px" placeholder="授权后自动填入" data-path="git.github_username"></div>
            <div class="field"><label>GitHub 令牌</label><input type="password" style="width:180px" placeholder="授权后自动填入，也可手填 PAT" data-path="git.github_token"></div>
            <div class="hintline" style="margin-left:0">推荐网页授权：填入 Client ID 后点按钮，浏览器里输入一次性代码即可，用户名与令牌自动写入。绑定后从 GitHub 拉取当天全部 commits，与本地仓库去重合并。</div>
          </section>

          <section class="panel" data-panel="server">
            <h2>服务</h2>
            <div class="field"><label>Host</label><input type="text" style="width:180px" data-path="server.host"></div>
            <div class="field"><label>Port</label><input type="number" step="1" min="1" max="65535" data-path="server.port"></div>
            <div class="hintline" style="margin-left:0">修改后需重启后端 (run.py) 才会生效。</div>
          </section>
        </main>
      </div>

      <footer class="settings-footer">
        <div class="footer-status" id="status">已加载</div>
        <button class="btn" id="resetBtn">重置</button>
        <button class="btn primary" id="saveBtn">保存</button>
      </footer>
    </div>
  </div>

  <div class="lumia-overlay" id="saveOverlay">
    <div class="overlay-card">
      <div class="overlay-title">更改即将生效</div>
      <div class="overlay-count"><b id="countNum">15</b> 秒后应用到后端</div>
      <button class="btn" id="undoSave">撤销保存</button>
      <button class="btn primary" id="applyNow">立即生效</button>
      <div class="overlay-bar"><div id="overlayBarFill"></div></div>
    </div>
  </div>

  <div class="lumia-handle"></div>
  <script src="chrome.js"></script>
  <script src="settings.js"></script>
</body>
</html>
